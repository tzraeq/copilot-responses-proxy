[package]
name = "copilot-responses-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bytes = "=1.10.1"
dirs = "6"
futures-util = "=0.3.31"
http-body-util = "=0.1.3"
hyper = { version = "=1.7.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "=0.1.17", features = ["http1", "http2", "server", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "=0.34.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync"] }
tray-icon = { version = "=0.22.2", default-features = false }

[features]
hide-console = []

[patch.crates-io]
httpdate = { path = "vendor/httpdate-1.0.3" }
